<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a2560"/>
      <stop offset="100%" stop-color="#020d26"/>
    </radialGradient>

    <!-- Chrome / Metallic Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#d4d8e2"/>
      <stop offset="50%" stop-color="#8a94a6"/>
      <stop offset="75%" stop-color="#e8ecf4"/>
      <stop offset="100%" stop-color="#9aa4b5"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Badge Background (Rounded Square) -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Gold bottom accent bar -->
  <rect x="14" y="55" width="36" height="2.5" rx="1.25" fill="url(#goldGrad)"/>

  <!-- Main Marinho Circular Emblem with Stylized M -->
  <g filter="url(#shadow)">
    <!-- Outer Upper Arc -->
    <path d="M 10,31 A 22,22 0 0,1 54,31" fill="none" stroke="url(#chromeGrad)" stroke-width="3.6" stroke-linecap="round"/>

    <!-- Outer Lower Arc -->
    <path d="M 10,33 A 22,22 0 0,0 54,33" fill="none" stroke="url(#chromeGrad)" stroke-width="3.6" stroke-linecap="round"/>

    <!-- The Iconic Central "M" -->
    <path d="M 10,32 L 18,32 L 25,18 L 32,36 L 39,18 L 46,32 L 54,32" 
          fill="none" 
          stroke="url(#chromeGrad)" 
          stroke-width="3.6" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>
</svg>
