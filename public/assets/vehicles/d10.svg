<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%" fill="none">
  <!-- D10 / C10 Classic Pickup Truck Silhouette Icon -->
  <g stroke="#031438" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#031438">
    <!-- Body Outline (Tall heavy-duty pickup) -->
    <path d="M 16 80 L 32 80 C 35 66 48 56 62 56 C 76 56 88 66 92 80 L 134 80 C 137 66 149 56 164 56 C 178 56 190 66 193 80 L 196 80 C 198 76 198 68 194 60 L 126 60 L 118 36 L 80 36 L 54 58 L 14 60 C 10 62 8 68 8 74 C 8 80 12 80 16 80 Z" />
    
    <!-- Big Cab Window -->
    <path d="M 64 56 L 82 40 L 112 40 L 112 56 Z" fill="#fab800" stroke="#fab800" stroke-width="1.5" />
    
    <!-- Cargo Bed Top Edge -->
    <line x1="122" y1="59" x2="194" y2="59" stroke="#fab800" stroke-width="2.5" />
    
    <!-- Wheels (Larger heavy-duty tires) -->
    <circle cx="62" cy="80" r="16" fill="#1e293b" stroke="#fab800" stroke-width="3"/>
    <circle cx="62" cy="80" r="7" fill="#cbd5e1"/>
    <circle cx="164" cy="80" r="16" fill="#1e293b" stroke="#fab800" stroke-width="3"/>
    <circle cx="164" cy="80" r="7" fill="#cbd5e1"/>
    
    <!-- Heavy Chrome Bumper -->
    <line x1="6" y1="78" x2="26" y2="78" stroke="#cbd5e1" stroke-width="4" />
    <line x1="188" y1="78" x2="198" y2="78" stroke="#cbd5e1" stroke-width="4" />
  </g>
</svg>
