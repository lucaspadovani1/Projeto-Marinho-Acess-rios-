    <!-- Body Outline (Pickup truck with open bed) -->
    <path d="M 18 80 L 32 80 C 35 68 47 60 60 60 C 73 60 85 68 88 80 L 132 80 C 135 68 147 60 160 60 C 173 60 185 68 188 80 L 192 80 C 195 78 196 72 194 65 L 126 65 L 118 44 L 84 44 L 56 64 L 16 66 C 12 67 11 72 11 76 C 11 80 14 80 18 80 Z" />
    
    <!-- Cabin Window -->
