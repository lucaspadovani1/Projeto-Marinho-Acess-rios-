    <line x1="184" y1="66" x2="188" y2="66" stroke="#e11d48" stroke-width="2.5" />
    <!-- Borrachão de porta lateral -->
    <line x1="90" y1="68" x2="126" y2="68" stroke="#1e293b" stroke-width="3" />
