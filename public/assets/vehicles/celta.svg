  <g stroke="#031438" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#031438">
    <!-- Body Outline (Curved aerodynamic compact hatch) -->
    <path d="M 20 80 L 34 80 C 37 68 49 60 62 60 C 75 60 87 68 90 80 L 126 80 C 129 68 141 60 154 60 C 167 60 179 68 182 80 L 188 80 C 192 78 193 72 190 64 L 176 52 L 140 42 L 86 42 L 54 62 L 16 66 C 12 68 12 73 12 76 C 12 80 15 80 20 80 Z" />
    
    <!-- Modern rounded windows -->
