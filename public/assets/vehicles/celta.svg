    <path d="M 120 46 L 138 46 L 164 54 L 152 60 L 120 60 Z" fill="#fab800" stroke="#fab800" stroke-width="1.5" />
    
    <!-- Wheels -->
    <circle cx="62" cy="80" r="15" fill="#1e293b" stroke="#fab800" stroke-width="3"/>
    <circle cx="62" cy="80" r="6" fill="#fab800"/>
    <circle cx="154" cy="80" r="15" fill="#1e293b" stroke="#fab800" stroke-width="3"/>
    <circle cx="154" cy="80" r="6" fill="#fab800"/>
    
