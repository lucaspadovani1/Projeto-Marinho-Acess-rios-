<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%" fill="none">
  <!-- Opala / Caravan Silhouette Icon -->
  <g stroke="#031438" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#031438">
    <!-- Body Outline (Longer hood, classic 6-cylinder proportions) -->
    <path d="M 14 80 L 30 80 C 33 68 45 60 58 60 C 71 60 83 68 86 80 L 132 80 C 135 68 147 60 160 60 C 173 60 185 68 188 80 L 194 80 C 196 78 197 70 194 66 L 174 65 L 148 42 L 96 42 L 68 64 L 12 65 C 9 66 8 72 8 76 C 8 80 11 80 14 80 Z" />
    
    <!-- Cabin Windows -->
    <path d="M 76 62 L 98 46 L 120 46 L 120 62 Z" fill="#fab800" stroke="#fab800" stroke-width="1.5" />
    <path d="M 125 46 L 144 46 L 168 62 L 125 62 Z" fill="#fab800" stroke="#fab800" stroke-width="1.5" />
    
    <!-- Wheels -->
    <circle cx="58" cy="80" r="15" fill="#1e293b" stroke="#fab800" stroke-width="3"/>
    <circle cx="58" cy="80" r="6" fill="#fab800"/>
    <circle cx="160" cy="80" r="15" fill="#1e293b" stroke="#fab800" stroke-width="3"/>
    <circle cx="160" cy="80" r="6" fill="#fab800"/>
    
    <!-- Headlight / Tail light -->
    <line x1="8" y1="70" x2="14" y2="70" stroke="#fab800" stroke-width="3" />
    <line x1="190" y1="71" x2="195" y2="71" stroke="#e11d48" stroke-width="3" />
    <!-- Friso lateral -->
    <line x1="88" y1="68" x2="132" y2="68" stroke="#cbd5e1" stroke-width="2" />
  </g>
</svg>
