<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1936"/>
      <stop offset="50%" stop-color="#040e24"/>
      <stop offset="100%" stop-color="#020816"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fab800"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Subtle glow ring -->
  <circle cx="400" cy="270" r="160" fill="none" stroke="#fab800" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="400" cy="270" r="130" fill="#081b3d" fill-opacity="0.5"/>

  <!-- Camera / Part icon -->
  <g transform="translate(340, 210)">
    <!-- Camera body -->
    <rect x="0" y="24" width="120" height="84" rx="14" fill="#0f2b5c" stroke="#334e7a" stroke-width="3"/>
    <path d="M 38 24 L 46 10 L 74 10 L 82 24 Z" fill="#0f2b5c" stroke="#334e7a" stroke-width="3"/>
    <circle cx="60" cy="66" r="26" fill="#061530" stroke="#fab800" stroke-width="3"/>
    <circle cx="60" cy="66" r="14" fill="#0a234d"/>
    <circle cx="66" cy="60" r="5" fill="#fab800" fill-opacity="0.8"/>
    <!-- Flash dot -->
    <circle cx="96" cy="38" r="4" fill="#ffd54f"/>
  </g>

  <!-- Brand badge -->
  <g transform="translate(400, 375)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#0b2046" stroke="#fab800" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="4" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#fab800" letter-spacing="2">
      FOTO EM ATUALIZAÇÃO
    </text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="435" text-anchor="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">
    Peça disponível no catálogo Marinho Acessórios
  </text>
  <text x="400" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">
    Para receber fotos em alta resolução deste item, fale com nosso atendente
  </text>

  <!-- WhatsApp Quick Callout button graphic -->
  <g transform="translate(400, 515)" text-anchor="middle">
    <rect x="-165" y="-18" width="330" height="36" rx="8" fill="#25D366" fill-opacity="0.15" stroke="#25D366" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#25D366">
      WHATSAPP OFICIAL: (45) 99927-7822
    </text>
  </g>
</svg>
